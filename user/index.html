<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./asset/style.css">
</head>

<body>
    <div id="header">
        <h1>torikakari</h1>
    </div>
    <div id="main">
        <div id="username">username</div>
        <div id="card_container">
            <div class="card">
                <div class="card_title">連続記録</div>
                <div class="card_body">30</div>
            </div>
            <div class="card">
                <div class="card_title">達成率</div>
                <div class="card_body">100%</div>
            </div>
            <div class="card">
                <div class="card_title">累計達成回数</div>
                <div class="card_body">320</div>
            </div>
            <div class="card">
                <div class="card_title">累計タスク時間</div>
                <div class="card_body">660時間</div>
            </div>
        </div>
        <div id="rating_container">
            <div class="rating">
                <div class="rating_title">総合評価</div>
                <div class="rating_star">
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                </div>
            </div>
        </div>
    </div>

    <script src="./asset/script.js"></script>
</body>

</html>
