<!DOCTYPE html>
<html lang="ja">

<head>
    <!-- ページ全体の基本設定と外部ファイルの読み込み -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>トリカカリ</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../asset/universal.css">
    <link rel="stylesheet" href="./asset/style.css">
</head>

<body>
    <header class="app-header">
        <div>
            <h1>トリカカリ</h1>
        </div>
        <span class="header-mark" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
    </header>

    <main class="page-content">
        <section class="intro">
            <span class="task-count" id="task_count">0件</span>
        </section>

        <section class="next-task" id="next_task" hidden aria-live="polite">
            <div class="next-task-heading">
                <span class="section-label">NEXT UP</span>
                <span class="next-task-badge"><i class="fa-solid fa-bolt" aria-hidden="true"></i> 直近の予定</span>
            </div>
            <p class="next-task-time" id="next_task_time"></p>
            <h2 class="next-task-name" id="next_task_name"></h2>
            <p class="next-task-date" id="next_task_date"></p>
            <a class="next-task-timer-button" id="next_task_timer" href="#">
                タイマーを開始
            </a>
        </section>

        <!-- 登録されたタスクが順番に表示されるリスト -->
        <ul id="task_list" aria-live="polite">
            <li class="empty-state" id="empty_state">
                <i class="fa-regular fa-calendar-check" aria-hidden="true"></i>
                <p>まだタスクがありません</p>
                <span>右下のボタンから追加できます</span>
            </li>
        </ul>

    </main>

    <button class="add-task-button" id="open_register" type="button">
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
        <span>タスクを追加</span>
    </button>

    <div class="modal-backdrop" id="modal_backdrop" hidden>
        <!-- タスク入力フォーム（時間・タスク名・登録ボタン） -->
        <div id="register_container" role="dialog" aria-modal="true" aria-labelledby="dialog_title">
            <div class="dialog-header">
                <div>
                    <h2 id="dialog_title">タスクを追加</h2>
                </div>
                <button class="close-button" id="close_register" type="button" aria-label="閉じる">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </div>
            <div class="form-field">
                <label for="task_name">タスク名</label>
                <input type="text" id="task_name" placeholder="例：資料を確認する">
            </div>
            <div class="form-row">
                <div class="form-field">
                    <label for="task_date">日付</label>
                    <input type="date" id="task_date">
                </div>
                <div class="form-field">
                    <label for="task_time">時間</label>
                    <input type="time" id="task_time">
                </div>
            </div>
            <div class="form-field">
                <label for="task_duration">所要時間（分）</label>
                <input type="number" id="task_duration" min="1" step="1" inputmode="numeric" placeholder="例：30">
            </div>
            <button id="add-btn" type="button">登録する</button>
        </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
        <span id="toast_message"></span>
    </div>
    <script src="../demo.js"></script>
    <script src="./asset/script.js"></script>
</body>

</html>
