<!DOCTYPE html>
<html lang="ja">

<head>
    <!-- ページ全体の基本設定と外部ファイルの読み込み -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#62c6a0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>トリカカリ</title>

    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="../icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="../icons/icon-192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../asset/universal.css">
    <link rel="stylesheet" href="./asset/style.css">
</head>

<body>
    <header class="app-header">
        <div>
            <h1>トリカカリ</h1>
        </div>
        <span class="header-mark" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
        <button class="login-button" id="open_login" type="button">ログイン</button>
    </header>

    <main class="page-content">
        <p class="auth-prompt" id="auth_prompt">ログインすると自分のタスクを確認・追加できます。</p>
        <section class="push-prompt" id="push_prompt" hidden>
            <p id="push_prompt_text">タスクの開始時刻に通知を受け取れます。</p>
            <button class="login-button" id="enable_push" type="button">
                <i class="fa-solid fa-bell" aria-hidden="true"></i> 通知を有効にする
            </button>
        </section>
        <section class="intro">
            <span class="task-count" id="task_count">0件</span>
        </section>

        <!-- 直近の予定。タップするとそのタスクのタイマー画面を開く -->
        <a class="next-task" id="next_task" href="../timer/index.html" hidden aria-live="polite">
            <div class="next-task-heading">
                <span class="section-label">NEXT UP</span>
                <span class="next-task-badge"><i class="fa-solid fa-bolt" aria-hidden="true"></i> 直近の予定</span>
            </div>
            <p class="next-task-time" id="next_task_time"></p>
            <h2 class="next-task-name" id="next_task_name"></h2>
            <p class="next-task-date" id="next_task_date"></p>
            <span class="next-task-hint">タップしてタイマーを開く <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></span>
        </a>

        <!-- 登録されたタスクが順番に表示されるリスト -->
        <ul id="task_list" aria-live="polite">
            <li class="empty-state" id="empty_state">
                <i class="fa-regular fa-calendar-check" aria-hidden="true"></i>
                <p>まだタスクがありません</p>
                <span>右下のボタンから追加できます</span>
            </li>
        </ul>

    </main>

    <button class="add-task-button" id="open_register" type="button" hidden>
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
        <span>タスクを追加</span>
    </button>

    <!-- タスク登録シート。画面下から出て、5つのステップを横スクロールで移動する -->
    <div class="sheet-backdrop" id="sheet_backdrop" hidden>
        <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="step_title">
            <!-- この部分を下にドラッグすると閉じる -->
            <div class="sheet-top" id="sheet_top">
                <div class="sheet-grip" aria-hidden="true"></div>
                <div class="sheet-head">
                    <h2 class="step-title" id="step_title">何をする？</h2>
                    <button class="close-button" id="close_register" type="button" aria-label="閉じる">
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                    </button>
                </div>
                <nav class="step-progress" id="step_progress" aria-label="入力の進み具合"></nav>
            </div>

            <div class="steps" id="steps">
                <!-- Step 1: タスク名 -->
                <section class="step" data-title="何をする？" aria-label="タスク">
                    <div class="step-body">
                        <p class="step-hint">タスクをタップすると次へ進みます。「前回」付きは前回の設定が入った状態で始まります。</p>
                        <div class="chips" id="template_chips"></div>
                        <div class="inline-input" id="new_task_box" hidden>
                            <input type="text" id="new_task_input" placeholder="新しいタスク名" enterkeyhint="done" aria-label="新しいタスク名">
                            <button type="button" id="new_task_submit">決定</button>
                        </div>
                        <button class="text-button" type="button" id="toggle_edit">テンプレートを編集</button>
                    </div>
                </section>

                <!-- Step 2: 日付 -->
                <section class="step" data-title="いつやる？" aria-label="日付">
                    <div class="step-body">
                        <div class="chips wide" id="date_chips"></div>
                        <div class="inline-input" id="date_other_box" hidden>
                            <input type="date" id="date_other_input" aria-label="日付">
                            <button type="button" id="date_other_submit">決定</button>
                        </div>
                    </div>
                </section>

                <!-- Step 3: 開始時刻 -->
                <section class="step" data-title="何時から？" aria-label="開始時刻">
                    <div class="step-body">
                        <!-- スクロールで選ぶダイヤル。止まっても次へは進まない -->
                        <div class="time-wheel" role="group" aria-label="開始時刻">
                            <div class="wheel-column" id="wheel_hour" aria-label="時"></div>
                            <span class="wheel-separator" aria-hidden="true">:</span>
                            <div class="wheel-column" id="wheel_minute" aria-label="分"></div>
                        </div>
                        <p class="time-note" id="time_note"></p>
                        <button class="sheet-primary" type="button" id="time_next">次へ</button>
                    </div>
                </section>

                <!-- Step 4: 所要時間 -->
                <section class="step" data-title="どれくらい？" aria-label="所要時間">
                    <div class="step-body">
                        <div class="chips wide four" id="duration_chips"></div>
                        <div class="inline-input" id="duration_other_box" hidden>
                            <input type="number" id="duration_other_input" min="1" step="1" inputmode="numeric" placeholder="分" aria-label="所要時間（分）">
                            <button type="button" id="duration_other_submit">決定</button>
                        </div>
                    </div>
                </section>

                <!-- Step 5: 確認 -->
                <section class="step" data-title="この内容で作成" aria-label="確認">
                    <div class="step-body">
                        <p class="summary" id="summary"></p>
                        <p class="summary-note" id="summary_note"></p>
                        <div class="option-row">
                            <button class="pill option off" type="button" id="notify_before" aria-pressed="false">5分前に通知</button>
                        </div>
                        <details class="description-details" id="description_details">
                            <summary>説明を追加（任意）</summary>
                            <textarea id="task_description" rows="3" placeholder="例：第3章を読み、気づいた点をメモする" aria-label="説明"></textarea>
                        </details>
                        <button class="sheet-primary" id="add-btn" type="button">この内容で予定を作成</button>
                    </div>
                </section>
            </div>
        </div>
    </div>
    <div class="modal-backdrop" id="login_backdrop" hidden>
        <form class="login-modal" id="login_form" role="dialog" aria-modal="true" aria-labelledby="login_title">
            <div class="dialog-header">
                <h2 id="login_title">ログイン</h2>
                <button class="close-button" id="close_login" type="button" aria-label="閉じる">×</button>
            </div>
            <div class="form-field">
                <label for="login_username">ユーザー名</label>
                <input id="login_username" type="text" autocomplete="username" required>
            </div>
            <div class="form-field">
                <label for="login_password">パスワード</label>
                <input id="login_password" type="password" autocomplete="current-password" required>
            </div>
            <p class="login-error" id="login_error" role="alert" hidden></p>
            <button class="login-submit" type="submit">ログインする</button>
        </form>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
        <i class="fa-solid fa-circle-exclamation" id="toast_icon" aria-hidden="true"></i>
        <span id="toast_message"></span>
    </div>
    <script src="../asset/api.js"></script>
    <script src="../asset/pwa.js"></script>
    <script src="./asset/time-wheel.js"></script>
    <script src="./asset/script.js"></script>
</body>

</html>
