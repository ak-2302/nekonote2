<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>トリカカリ</title>

    <l ink rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./asset/style.css">
</head>


<body>
    <header>
    <h1>トリカカリ</h1>
    </header>
    <h1>家事</h1>

 
    <!-- タイマー表示（初期値1分） -->
    <div id="timer" class="timer-display">01:00</div>

    <!-- 再開ボタンを追加したボタン構造 -->
    <div class="button-row">
        <div class="button-area">
            <button onclick="pauseTimer()">一時停止</button>
        </div>

        <div class="button-area">
            <button onclick="startTimer()">再開</button>
        </div>

        <div class="button-area">
            <button onclick="stopTimer()">終了ボタン</button>
        </div>
    </div>

    <script>
        let timeLeft = 60; // 1分（60秒）
        let timerId = null;
        const timerElement = document.getElementById('timer');

        // 表示の更新
        function updateDisplay() {
            const minutes = String(Math.floor(timeLeft / 60)).padStart(2, '0');
            const seconds = String(timeLeft % 60).padStart(2, '0');
            timerElement.textContent = `${minutes}:${seconds}`;
        }

        // タイマーの開始・再開
        function startTimer() {
            if (timerId !== null || timeLeft <= 0) return; // 既に動いているか、0秒のときは何もしない
            timerId = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    pauseTimer();
                    alert('時間です！');
                }
            }, 1000);
        }

        // 一時停止
        function pauseTimer() {
            clearInterval(timerId);
            timerId = null;
        }

        // 終了ボタン（タイマーを止めて1分に戻す）
        function stopTimer() {
            pauseTimer();
            timeLeft = 60;
            updateDisplay();
        }

        // ページ読み込み完了と同時にスタート
        window.onload = function() {
            updateDisplay();
            startTimer();
        };
    </script>
</body>

</html>
